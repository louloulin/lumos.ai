[workspace]
members = [
    "lumosai_core",
    "lumosai_examples",
    "lumosai_vector",
    "lumosai_rag",
    "lumosai_cli",
    "lumosai_evals",
    "lumosai_network",
    "lumos_macro",
    "lumosai_mcp",
    # "lumosai_derive",
    # "lumosai_bindings",
    # "lumosai_ui",
    # "lumosai_ui/web-server",
    # "lumosai_cloud",
    # "lumosai_ai_extensions"
]
# 排除有问题的包
exclude = [
    "lumosai_vector/postgres",
    "lumosai_marketplace",
    "lumosai_enterprise",
    # 暂时排除 UI 相关包（有 LabelRole 错误）
    "lumosai_ui",
    "lumosai_ui/web-server",
    # 暂时排除其他复杂包
    "lumosai_derive",
    "lumosai_bindings"
]
resolver = "2"

# Removed lumosai_stores - migrated to new unified vector architecture

[package]
name = "lumosai"
version = "0.2.0"
edition = "2021"
authors = ["Lumosai Team <team@lumosai.dev>"]
description = "企业级 AI 代理框架 - 高性能、类型安全的 Rust AI 应用开发框架"
license = "MIT"
repository = "https://github.com/louloulin/lumos.ai.git"
homepage = "https://lumosai.dev"
documentation = "https://docs.rs/lumosai"
readme = "README.md"
keywords = ["ai", "agent", "rust", "framework", "enterprise", "llm"]
categories = ["development-tools", "api-bindings", "science"]
exclude = [
    "/.github/",
    "/scripts/",
    "/docs/",
    "/examples/",
    "/tests/",
    "/benches/",
    "*.md",
    "release.toml",
    "deny.toml",
    ".gitignore",
    ".gitattributes",
]

[lib]
name = "lumosai"
path = "src/lib.rs"

[workspace.dependencies]
# 核心依赖
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1.80"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
redis = { version = "0.26", features = ["tokio-comp"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls"] }

# 工具库
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
url = "2.5"

# Arrow ecosystem - use stable versions
arrow = "54.0.0"
arrow-array = "54.0.0"
arrow-schema = "54.0.0"
arrow-buffer = "54.0.0"
arrow-data = "54.0.0"
arrow-arith = "54.0.0"
arrow-cast = "54.0.0"
arrow-csv = "54.0.0"
arrow-ipc = "54.0.0"
arrow-json = "54.0.0"
arrow-ord = "54.0.0"
arrow-row = "54.0.0"
arrow-select = "54.0.0"
arrow-string = "54.0.0"

# LanceDB ecosystem - compatible versions
lancedb = "0.18.0"
lance = "0.27.0"

# Compression libraries - fix zstd version conflicts
zstd = "0.13"
zstd-safe = "7.0"

# UI 框架依赖
dioxus = { version = "0.6", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = { version = "0.6", default-features = false }
daisy_rsx = "0.1.30"
axum = { version = "0.8", default-features = false }
axum-extra = { version = "0.10", features = ["typed-routing"] }
time = { version = "0.3.36", features = ["formatting", "parsing", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
oas3 = "0.16.1"
comrak = { version = "0.39.0", features = ["shortcodes"] }
mime = "0.3.0"

# 测试工具
tokio-test = "0.4"
mockall = "0.11"
mockito = "1.2"
tempfile = "3.8"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[features]
default = ["integrations"]
# 暂时移除 macros 功能
# macros = ["lumos_macro"]
integrations = ["reqwest"]
# 暂时移除 UI 功能
# ui = ["lumosai_ui"]
# ui-full = ["ui"]
# Vector database features - 仅保留内存存储
vector-memory = ["lumosai_vector/memory"]
# 暂时移除其他向量数据库
# vector-qdrant = ["lumosai_vector/qdrant"]
# vector-weaviate = ["lumosai_vector/weaviate"]
# vector-postgres = ["lumosai_vector"]
# vector-all = ["vector-qdrant", "vector-weaviate", "vector-postgres"]
# Additional features for cfg conditions
# postgres = ["sqlx/postgres"]
# qdrant = ["vector-qdrant"]
# weaviate = ["vector-weaviate"]

[dependencies]
# 仅保留核心依赖
lumosai_core = { path = "lumosai_core" }
lumosai_vector = { path = "lumosai_vector", features = ["memory"], optional = true }
lumosai-vector-core = { path = "lumosai_vector/core" }
# 暂时移除其他依赖
# lumosai_evals = { path = "lumosai_evals" }
# lumosai_rag = { path = "lumosai_rag" }
# lumosai_network = { path = "lumosai_network" }
# lumosai_ui = { path = "lumosai_ui", optional = true }
# lumos_macro = { path = "lumos_macro", optional = true }
redis = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

reqwest = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
