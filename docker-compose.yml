# LumosAI 完整部署配置
# 包含 LumosAI 服务 + 所有依赖（数据库、向量存储、缓存）

version: '3.8'

services:
  # ============================================================================
  # LumosAI 主服务
  # ============================================================================
  lumosai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumosai-server
    ports:
      - "8080:8080"
    environment:
      # 日志配置
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      
      # 数据库配置
      - DATABASE_URL=postgres://postgres:lumosai_pass@postgres:5432/lumosai
      - REDIS_URL=redis://redis:6379
      
      # 向量数据库配置
      - QDRANT_URL=http://qdrant:6333
      - WEAVIATE_URL=http://weaviate:8081
      
      # JWT 配置
      - JWT_SECRET=change-this-secret-in-production-at-least-32-bytes
      - JWT_EXPIRATION=3600
      
      # LLM API Keys (optional - 用于测试)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY:-}
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - lumosai-network

  # ============================================================================
  # PostgreSQL - 主数据库（带 pgvector 扩展）
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumosai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lumosai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=lumosai_pass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumosai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lumosai-network

  # ============================================================================
  # Redis - 缓存和会话存储
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: lumosai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass lumosai_redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lumosai-network

  # ============================================================================
  # Qdrant - 向量数据库
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: lumosai-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - lumosai-network

  # ============================================================================
  # Weaviate - 向量数据库（备选）
  # ============================================================================
  weaviate:
    image: semitechnologies/weaviate:1.22.4
    container_name: lumosai-weaviate
    ports:
      - "8081:8080"  # 改为 8081 避免与 LumosAI 冲突
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=text2vec-openai,text2vec-cohere
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lumosai-network

# ============================================================================
# 数据卷
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  weaviate_data:
    driver: local

# ============================================================================
# 网络
# ============================================================================
networks:
  lumosai-network:
    driver: bridge
    name: lumosai-network

