[package]
name = "multi-agent"
version = "0.2.0"
edition = "2021"

[workspace]

[dependencies]
lumosai = { path = "../../../", version = "0.2.0" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
