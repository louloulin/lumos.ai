[package]
name = "research-assistant"
version = "0.2.0"
edition = "2021"

[workspace]

[dependencies]
lumosai = { path = "../../../", version = "0.2.0" }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.20"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
