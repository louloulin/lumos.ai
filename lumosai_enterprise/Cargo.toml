[package]
name = "lumosai_enterprise"
version = "0.2.0"
edition = "2021"
description = "Lumos.ai企业级功能扩展模块 - 监控、安全、合规、多租户"
license = "MIT"
repository = "https://github.com/louloulin/lumos.ai.git"
keywords = ["ai", "agent", "enterprise", "monitoring", "security"]
categories = ["development-tools", "web-programming"]

[dependencies]
# Core dependencies
lumosai_core = { path = "../lumosai_core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Database and storage
sqlx = { workspace = true, default-features = false, features = ["postgres", "chrono", "uuid", "runtime-tokio-rustls"] }
redis = { workspace = true }

# Web framework
axum = { workspace = true, features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Monitoring and observability
prometheus = { version = "0.13", optional = true }
opentelemetry = "0.21"
opentelemetry-prometheus = { version = "0.14", optional = true }
opentelemetry-jaeger = { version = "0.20", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"

# Security and encryption
jsonwebtoken = "9.0"
bcrypt = "0.15"
ring = "0.17"
rustls = "0.21"
x509-parser = "0.15"

# Machine learning for anomaly detection
candle-core = { version = "0.3", optional = true }
candle-nn = { version = "0.3", optional = true }
candle-transformers = { version = "0.3", optional = true }

# Configuration and validation
config = "0.14"
validator = { version = "0.16", features = ["derive"] }

# Async and utilities
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"

# HTTP client
reqwest = { workspace = true, features = ["json"] }

# Compression and serialization
flate2 = "1.0"
bincode = "1.3"

# Time and scheduling
cron = "0.12"
tokio-cron-scheduler = "0.9"

# Email notifications
lettre = { version = "0.11", optional = true }

# Metrics and statistics
statrs = "0.16"

[dev-dependencies]
tempfile = "3.0"
mockall = "0.12"
wiremock = "0.5"

[features]
default = ["postgres", "prometheus", "jaeger"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
prometheus = ["opentelemetry-prometheus", "dep:prometheus"]
jaeger = ["opentelemetry-jaeger"]
ml-anomaly = ["candle-core", "candle-nn", "candle-transformers"]
email-alerts = ["lettre"]
