[package]
name = "lumosai-vector-postgres"
version = "0.1.4"
edition = "2021"
authors = ["Lumos.ai Team <team@lumos.ai>"]
description = "PostgreSQL with pgvector implementation for lumos-vector-core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/louloulin/lumos.ai.git"

[dependencies]
# New unified architecture
lumosai-vector-core = { path = "../core" }

# PostgreSQL dependencies - use workspace dependencies without sqlite
sqlx = { workspace = true, features = ["postgres", "json", "uuid", "chrono"] }

# Core dependencies
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
testcontainers = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
test-integration = []

[[bench]]
name = "postgres_benchmark"
harness = false
required-features = []
